<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you — DK Keys</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root { --brand:#1a3a5c; --brand-dark:#102540; --text:#222; --muted:#666; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--text);background:#fff;line-height:1.5}
  header{background:var(--brand);color:#fff;padding:18px 24px;text-align:center}
  header a{color:#fff;text-decoration:none;font-weight:600;letter-spacing:.5px}
  main{max-width:680px;margin:0 auto;padding:80px 24px 120px;text-align:center}
  h1{font-size:42px;color:var(--brand-dark);margin:0 0 16px;line-height:1.2}
  .accent{display:inline-block;width:80px;height:3px;background:var(--brand);margin:0 auto 28px}
  p{font-size:17px;color:var(--muted);margin:0 0 12px}
  .cta{display:inline-block;margin-top:32px;padding:14px 36px;background:var(--brand);color:#fff;text-transform:uppercase;font-weight:600;letter-spacing:1px;font-size:14px;text-decoration:none;transition:background .2s}
  .cta:hover{background:var(--brand-dark)}
  .phone{margin-top:48px;font-size:15px;color:#444}
  .phone a{color:var(--brand-dark);font-weight:600;text-decoration:none}
</style>
<style id="dk-migration-overrides">
/* Footer section — dark navy background (et-divi-dynamic not archived) */
.et_pb_section_0_tb_footer.et_pb_section {
  background-color: #0d1b2a !important;
  padding-top: 54px !important;
  padding-bottom: 54px !important;
}
/* Ensure dark-layout text is white */
.et_pb_bg_layout_dark, .et_pb_bg_layout_dark p, .et_pb_bg_layout_dark h1,
.et_pb_bg_layout_dark h2, .et_pb_bg_layout_dark h3, .et_pb_bg_layout_dark h4,
.et_pb_bg_layout_dark a, .et_pb_bg_layout_dark .et_pb_blurb_description {
  color: #ffffff !important;
}
.et_pb_bg_layout_dark .et_pb_button {
  color: #2ea3f2 !important;
  border-color: #2ea3f2 !important;
}
/* Footer column layout */
.et_pb_row_0_tb_footer { max-width: 1280px; margin: 0 auto; }
/* Contact form in footer — basic readable styling */
.et_pb_contact_form_0_tb_footer .et_pb_contact_field input,
.et_pb_contact_form_0_tb_footer .et_pb_contact_message {
  background: rgba(255,255,255,0.1) !important;
  border: 1px solid rgba(255,255,255,0.3) !important;
  color: #fff !important;
}
.et_pb_contact_form_0_tb_footer .et_pb_contact_field input::placeholder,
.et_pb_contact_form_0_tb_footer .et_pb_contact_message::placeholder { color: rgba(255,255,255,0.5) !important; }
.et_pb_contact_form_0_tb_footer label { color: #fff !important; }
/* Section 5 (Reviews section) background */
.et_pb_section_5.et_pb_section { background-color: #f5f5f5 !important; padding: 40px 0 !important; }
/* Section 4 bg */
.et_pb_section_4.et_pb_section { background-color: #0d1b2a !important; }
.et_pb_section_4 .et_pb_column, .et_pb_section_4 p, .et_pb_section_4 h2,
.et_pb_section_4 h3, .et_pb_section_4 span { color: #fff !important; }
</style>
</head>
<body>
<header><a href="/">DK Keys</a></header>
<main>
  <h1>Thanks — we got your message.</h1>
  <span class="accent"></span>
  <p>We'll be in touch soon.</p>
  <a class="cta" href="/">Back to home</a>
  <div class="phone">Or call <a href="tel:2143251227">(214) 325-1227</a></div>
</main>
</body>
</html>
